name: Refresh recent public projects
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
permissions: {}
concurrency:
  group: profile-readme
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check safety filters
        run: python3 -m unittest discover -s scripts -v
      - name: Refresh approved public projects
        run: python3 scripts/recent_projects.py
      - name: Commit only if the README changed
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh recent public projects'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
